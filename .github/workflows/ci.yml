name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev ninja-build -y

      # ASan
      - name: Configure ASan
        run: cmake --preset asan -DPATCH_VERSION=${{ github.run_number }}

      - name: Build ASan
        run: cmake --build --preset asan

      - name: Run ASan Test
        run: ./build/asan/main

      # UBSan
      - name: Configure UBSan
        run: cmake --preset ubsan

      - name: Build UBSan
        run: cmake --build --preset ubsan

      - name: Run UBSan Test
        run: ./build/ubsan/main

      # Linux Release
      - name: Configure Linux Release
        run: cmake --preset linux-release -DPATCH_VERSION=${{ github.run_number }}

      - name: Build Linux Release
        run: cmake --build --preset linux-release

      - name: Create DEB Package
        run: cmake --build ./build/linux-release --target package

      - name: Prepare DEB
        run: |
          DEB=$(find ./build/linux-release -maxdepth 1 -name '*.deb' -type f | head -n 1)
          test -n "$DEB"
          cp "$DEB" "./build/linux-release/LB1_26-0.0.${{ github.run_number }}-Linux.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ./build/linux-release/LB1_26-0.0.${{ github.run_number }}-Linux.deb


  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      - name: Configure Windows Release
        run: cmake --preset windows-release

      - name: Build Windows Release
        run: cmake --build --preset windows-release

      - name: Run Windows Test
        run: .\build\windows-release\main.exe

      - name: Prepare Windows executable
        run: |
          Copy-Item .\build\windows-release\main.exe .\build\windows-release\LB1_26-0.0.${{ github.run_number }}-Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ./build/windows-release/LB1_26-0.0.${{ github.run_number }}-Windows.exe


  release:
    needs:
      - linux
      - windows

    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: ./release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./release

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: true

      - name: Upload Linux DEB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/LB1_26-0.0.${{ github.run_number }}-Linux.deb
          asset_name: LB1_26-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload Windows EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/LB1_26-0.0.${{ github.run_number }}-Windows.exe
          asset_name: LB1_26-0.0.${{ github.run_number }}-Windows.exe
          asset_content_type: application/vnd.microsoft.portable-executable